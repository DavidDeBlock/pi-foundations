<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f0e6" />
  <title>Cozy Ledger — Ons huishoudboekje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=19" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235a7248'%3E%3Cpath d='M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-7v6h-4A1.5 1.5 0 0 1 3 19.5v-9Z'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='%23faf7f1'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- Subtle background decorations (injected by JS) -->
  <div class="deco-bg" aria-hidden="true"></div>

  <div class="app" id="app"></div>

  <!-- Floating add button (mobile) -->
  <button class="fab" id="fab" title="Transactie toevoegen" aria-label="Transactie toevoegen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!--
    Script load order matters — there's no module system, only the
    shared `window` namespace. The chain below matches the dependency
    graph: pure helpers first, then shared infrastructure, then views
    and modals, then the bootstrap (`app.js`) which references
    everything.
      types.js      — JSDoc @typedefs only (User, Source, Category,
                      Group, Transaction, Settings, State). Loaded
                      first so editor tooling sees them across files.
                      No executable code, no globals.
      data.js       — seed state + Store + Fmt inputs
      utils.js      — Fmt, $, el, toast, confirmAction
      icons.js      — Icons + Deco + Logo (SVGs)
      csv.js        — CSVImport (regex payee extract lives here)
      selectors.js  — pure scope / date / payee selectors
      i18n.js       — t() + Strings.nl
      backup.js     — Backup.exportJSON/CSV + parseAndValidate + applyImport
      router.js     — view state + dispatch
      shell.js      — sidebar + topbar + month picker + scope pills
      views/_helpers.js — sum/emptyState/escape/bulkUpdatePayeeCategory + …
      views/dashboard.js
      views/trends.js
      views/transactions.js
      views/categories.js
      views/sources.js
      views/users.js
      views/payees.js
      views/settings.js
      charts/_helpers.js — chart palette + colorForSource
      charts/monthly-flow.js
      charts/balance-trajectory.js
      modals/_helper.js   — Modal.create() (used by all opener files)
      modals/import-preview.js  — pure CSV preview rendering
      modals/transaction.js
      modals/category.js
      modals/group.js
      modals/source.js
      modals/user.js
      modals/import.js
      modals/import-confirm.js
      app.js        — bootstrap: init() + bindGlobal()
  -->
  <script src="types.js?v=19"></script>
  <script src="data.js?v=19"></script>
  <script src="utils.js?v=19"></script>
  <script src="icons.js?v=19"></script>
  <script src="csv.js?v=19"></script>
  <script src="selectors.js?v=19"></script>
  <script src="i18n.js?v=19"></script>
  <script src="backup.js?v=19"></script>
  <script src="router.js?v=19"></script>
  <script src="shell.js?v=19"></script>
  <script src="views/_helpers.js?v=19"></script>
  <script src="views/dashboard.js?v=19"></script>
  <script src="views/trends.js?v=19"></script>
  <script src="views/_period-selector.js?v=19"></script>
  <script src="views/transactions.js?v=19"></script>
  <script src="views/categories.js?v=19"></script>
  <script src="views/sources.js?v=19"></script>
  <script src="views/users.js?v=19"></script>
  <script src="views/payees.js?v=19"></script>
  <script src="views/settings.js?v=19"></script>
  <script src="charts/_helpers.js?v=19"></script>
  <script src="charts/monthly-flow.js?v=19"></script>
  <script src="charts/balance-trajectory.js?v=19"></script>
  <script src="modals/_helper.js?v=19"></script>
  <script src="modals/import-preview.js?v=19"></script>
  <script src="modals/transaction.js?v=19"></script>
  <script src="modals/category.js?v=19"></script>
  <script src="modals/group.js?v=19"></script>
  <script src="modals/source.js?v=19"></script>
  <script src="modals/user.js?v=19"></script>
  <script src="modals/import.js?v=19"></script>
  <script src="modals/import-confirm.js?v=19"></script>
  <script src="app.js?v=19"></script>
  <script>
    // Inject decorative SVGs (kept here so icons.js isn't tangled with HTML)
    (function injectDeco() {
      const host = document.querySelector('.deco-bg');
      if (!host) return;
      const items = [
        { cls: 'd1', svg: window.Deco ? window.Deco.leaf : '' },
        { cls: 'd2', svg: window.Deco ? window.Deco.coin : '' },
        { cls: 'd3', svg: window.Deco ? window.Deco.receipt : '' },
        { cls: 'd4', svg: window.Deco ? window.Deco.house : '' },
        { cls: 'd5', svg: window.Deco ? window.Deco.dots : '' },
      ];
      host.innerHTML = items.map(i => `<div class="${i.cls}">${i.svg}</div>`).join('');
    })();

    // FAB quick-add
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fab').addEventListener('click', () => {
        document.getElementById('add-txn-btn')?.click();
      });
    });

    // Boot
    App.init();
  </script>
</body>
</html>
