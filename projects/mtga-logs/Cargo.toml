[package]
name = "mtga-logs"
version = "0.1.0"
edition = "2021"
description = "Read and print parsed MTG Arena Player.log events"
publish = false

[dependencies]
# Minimal feature set: skip the `tailer` (tokio + filesystem tailing) feature
# and keep just the sync `parse_whole_log` entry point we use here.
# To add live tailing later, re-enable default features.
manasight-parser = { version = "0.5", default-features = false, features = ["brace_depth_flush"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
